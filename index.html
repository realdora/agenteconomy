        <h1>AI Agent Payment Data Dashboard</h1>
        <p>agenteconomy.to is a free dashboard for on-chain AI agent payment analytics. We track 170M+ on-chain events from 5 agent payment protocols across 11+ blockchains — a comprehensive view of machine-to-machine commerce activity.</p>

        <h2>What is the Agent Economy?</h2>
        <p>The agent economy (also called the agentic economy or AI agent economy) is the emerging ecosystem where autonomous AI agents transact, pay for services, and settle payments on-chain without human intervention. As AI agents become economic actors, new payment protocols are being built to support machine-to-machine commerce, agent-to-agent payments, and autonomous transactions using stablecoins and smart contracts. The agent economy represents the next frontier of crypto, DeFi, and AI convergence.</p>

        <h2>AI Agent Payment Protocols We Track</h2>

        <h3>x402 Protocol — HTTP-Native AI Agent Payments</h3>
        <p>x402 is an open HTTP payment standard by Coinbase using the HTTP 402 status code. It enables AI agents to pay for API resources per request using stablecoins. Foundation members include Google, Visa, AWS, Circle, Anthropic, Vercel, and Cloudflare. x402 is the dominant agent payment protocol by transaction volume, with over 144 million on-chain events and $40M+ USD settled across Base, Solana, Polygon, BNB, Avalanche, Arbitrum, and SEI.</p>

        <h3>ERC-8004 — Multi-Chain AI Agent Identity Registry</h3>
        <p>ERC-8004 defines AI agent identity and reputation across multiple blockchains. Proposed by the Ethereum Foundation dAI team with MetaMask, Google, and Coinbase. Over 210,000 agents registered across 22 chains including BNB, Ethereum, Base, MegaETH, and Monad.</p>

        <h3>Olas / Autonolas — Autonomous Agent Transactions</h3>
        <p>Olas (Autonolas) is a decentralized network for autonomous AI agent services. With over 16 million on-chain transactions, Olas agents operate primarily on Gnosis Chain. Olas enables agent-to-agent coordination, prediction markets, and autonomous economic activity.</p>

        <h3>ERC-8183 / Virtuals ACP — Agent-to-Agent Commerce Protocol</h3>
        <p>ERC-8183 (Virtuals Agent Commerce Protocol) enables trustless agent-to-agent commerce with escrowed payments and evaluator verification. ACP tracks job lifecycle memos — create, deliver, evaluate, settle — across 3,400+ autonomous agents with over $3M in agent GDP and 12M+ on-chain events.</p>

        <h3>MPP — Tempo / Stripe Machine Payment Protocol</h3>
        <p>MPP is an open HTTP payment standard co-authored by Stripe and Tempo. Tempo is a payments-focused EVM-compatible L1 incubated by Stripe and Paradigm. MPP tracks on-chain stablecoin settlement events for AI agent-to-service payments.</p>

        <h2>Data Sources and Methodology</h2>
        <p>All data comes from verified on-chain smart contracts across Base, Solana, Polygon, BNB, Avalanche, Arbitrum, SEI, Gnosis, Ethereum, MegaETH, Monad, and Tempo chains. Sources include Dune Analytics community queries and direct RPC indexing. Data refreshes daily.</p>

        <h2>Which Blockchains Have AI Agents?</h2>
        <p>AI agents are active across all major blockchains. Base (by Coinbase) leads in x402 agent payment volume. Gnosis Chain hosts 97% of Olas/Autonolas autonomous agent transactions. BNB Chain leads in ERC-8004 agent identity registrations. Other chains with significant AI agent activity include Solana, Polygon, Arbitrum, Avalanche, SEI, Ethereum mainnet, MegaETH, and Monad. The Tempo L1 (backed by Stripe and Paradigm) is emerging as a dedicated chain for machine-to-machine payments.</p>

        <h2>How Do AI Agents Pay for Services?</h2>
        <p>AI agents use stablecoins (primarily USDC) to pay for on-chain and off-chain services autonomously. The x402 protocol enables HTTP-native payments where agents pay per API request. Virtuals ACP enables agent-to-agent hiring with escrow. Olas agents use smart contracts for autonomous coordination. Tempo MPP provides payment channels for high-frequency micro-transactions. All agent payments are settled on-chain with full transparency and auditability.</p>

        <h2>Machine-to-Machine Payment Protocols Comparison</h2>
        <p>The five major machine-to-machine (M2M) and AI agent payment protocols each serve different use cases: x402 excels at API-level micropayments, ERC-8004 provides the identity layer agents need before transacting, Olas handles autonomous multi-agent coordination, Virtuals ACP enables agent-to-agent commerce marketplaces, and Tempo MPP bridges traditional finance infrastructure (Stripe) with on-chain settlement. agenteconomy.to is the only dashboard that tracks all five protocols in a single view.</p>
