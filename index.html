        <h2>What is the Agent Economy?</h2>
        <p>The agent economy (also called the agentic economy or AI agent economy) is the emerging ecosystem where autonomous AI agents transact, pay for services, and settle payments on-chain without human intervention. As AI agents become economic actors, new payment protocols are being built to support machine-to-machine commerce, agent-to-agent payments, and autonomous transactions using stablecoins and smart contracts. The agent economy represents the next frontier of crypto, DeFi, and AI convergence.</p>

        <h2>AI Agent Payment Protocols We Track</h2>

        <h3>x402 Protocol — HTTP-Native AI Agent Payments</h3>
        <p>x402 is an open HTTP payment standard by Coinbase using the HTTP 402 status code. It enables AI agents to pay for API resources per request using stablecoins. Foundation members include Google, Visa, AWS, Circle, Anthropic, Vercel, and Cloudflare. x402 is the dominant agent payment protocol by transaction volume, with over 139 million on-chain events and $38M+ USD settled across Base, Solana, Polygon, BNB, Avalanche, Arbitrum, and SEI.</p>

        <h3>ERC-8004 — Multi-Chain AI Agent Identity Registry</h3>
        <p>ERC-8004 defines AI agent identity and reputation across multiple blockchains. Proposed by the Ethereum Foundation dAI team with MetaMask, Google, and Coinbase. Over 171,000 agents registered across 22 chains including BNB, Ethereum, Base, MegaETH, and Monad.</p>

        <h3>Olas / Autonolas — Autonomous Agent Transactions</h3>
        <p>Olas (Autonolas) is a decentralized network for autonomous AI agent services. With over 15.7 million on-chain transactions, Olas agents operate primarily on Gnosis Chain. Olas enables agent-to-agent coordination, prediction markets, and autonomous economic activity.</p>

        <h3>ERC-8183 / Virtuals ACP — Agent-to-Agent Commerce Protocol</h3>
        <p>ERC-8183 (Virtuals Agent Commerce Protocol) enables trustless agent-to-agent commerce with escrowed payments and evaluator verification. ACP tracks job lifecycle memos — create, deliver, evaluate, settle — across 3,400+ autonomous agents with over $3M in agent GDP and 11.8M+ on-chain events.</p>

        <h3>MPP — Tempo / Stripe Machine Payment Protocol</h3>
        <p>MPP is an open HTTP payment standard co-authored by Stripe and Tempo. Tempo is a payments-focused EVM-compatible L1 incubated by Stripe and Paradigm. MPP tracks on-chain stablecoin settlement events for AI agent-to-service payments.</p>
