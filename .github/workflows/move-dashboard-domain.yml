# ONE-OFF: move dashboard.agenteconomy.to old project -> agenteconomy-dash-v2.
# Delete this file after the run succeeds.
name: One-off move dashboard domain
on: workflow_dispatch
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Move domain between projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          TEAM="teamId=team_fFSVN6tRoGVgunTP7gDNa5g3"
          DEL=$(curl -s -X DELETE "https://api.vercel.com/v9/projects/agenteconomy/domains/dashboard.agenteconomy.to?$TEAM" -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "delete from old: $DEL"
          ADD=$(curl -s -X POST "https://api.vercel.com/v10/projects/agenteconomy-dash-v2/domains?$TEAM" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d '{"name":"dashboard.agenteconomy.to"}')
          echo "add to new: $ADD"
          echo "$ADD" | grep -q '"apexName"' || { echo "::error::domain add failed"; exit 1; }
