name: Restore Apex Cache 20261005
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Refresh restored production metrics in apex cache
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_fFSVN6tRoGVgunTP7gDNa5g3
          VERCEL_PROJECT_ID: prj_Tl7iGyxrRvj0GWVtTUJ2Cpkeet0T
        run: |
          test "$(date -u +%F)" = '2026-10-04' || exit 1
          npx -y vercel@50.4.0 cache purge --yes --token="$VERCEL_TOKEN"
