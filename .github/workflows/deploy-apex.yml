name: Deploy Apex
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the reviewed apex commit (false only inspects current production)'
        type: boolean
        default: false
      commit:
        description: 'Reviewed full commit SHA from the apex branch'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-apex
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inspect existing apex project
        id: project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=await fetch('https://api.vercel.com/v9/projects/agenteconomy-v4?teamId=team_fFSVN6tRoGVgunTP7gDNa5g3',{headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}});
          if(!r.ok) throw Error(`Vercel project HTTP ${r.status}`);
          const p=await r.json();
          if(p.name!=='agenteconomy-v4'||p.accountId!=='team_fFSVN6tRoGVgunTP7gDNa5g3')throw Error('Unexpected project');
          console.log(JSON.stringify({id:p.id,name:p.name,framework:p.framework,production:p.targets?.production},null,2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`project_id=${p.id}\n`);
          JS
      - name: Validate and deploy reviewed apex
        if: inputs.deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_fFSVN6tRoGVgunTP7gDNa5g3
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          node --test scripts/complete-days.test.mjs
          npx -y vercel@50.4.0 deploy --prod --yes --token="$VERCEL_TOKEN"
