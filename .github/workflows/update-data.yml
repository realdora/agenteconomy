name: Update Dune Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    concurrency:
      group: update-data
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch Dune data
        id: fetch-data
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          # Recent-window query ids, set as repo VARIABLES (gh variable set …)
          # once the queries are recreated under the working account — see
          # scripts/dune/RUNBOOK-2026-06-29.md. Empty/unset falls back to the
          # code defaults (the dead forks, which fail safe into previous-build).
          DUNE_QID_X402_CUMULATIVE: ${{ vars.DUNE_QID_X402_CUMULATIVE }}
          DUNE_QID_REGISTRY: ${{ vars.DUNE_QID_REGISTRY }}
          # Until each source has its own recent-window query, the daily cron is
          # only allowed to execute x402. Other stale sections reuse the last
          # published data and cannot spend Dune credits.
          DUNE_REFRESH_KEYS: 'x402Cumulative'
          # Credit governor: free Dune plan has 2,500 credits/month. Keep a
          # 500-credit reserve for manual recovery and unexpected export costs.
          DUNE_MAX_EXECUTIONS_PER_RUN: '1'
          DUNE_MONTHLY_CREDIT_CAP: '2000'
          DUNE_RUN_CREDIT_CAP: '10'
          DUNE_QUERY_CREDIT_CAP: '10'
        run: node scripts/fetch-data.js

      - name: Commit updated data.json
        id: commit-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update Dune data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel production deployment
        if: steps.commit-data.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Missing VERCEL_DEPLOY_HOOK_URL secret. Vercel Git auto-deploy should still deploy this data commit."
            exit 0
          fi
          case "$VERCEL_DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/prj_*)
              ;;
            *)
              echo "::warning::VERCEL_DEPLOY_HOOK_URL is not a Vercel deploy hook URL. Skipping optional deploy hook; Vercel Git auto-deploy should still deploy this data commit."
              exit 0
              ;;
          esac
          curl --connect-timeout 10 --max-time 30 -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"

      # Freshness SLA gate — runs AFTER commit/deploy so stale-but-honest data
      # still ships; the red run is the signal that a human needs to look.
      - name: Freshness SLA gate
        if: steps.fetch-data.outputs.sla_breach == 'true'
        run: |
          echo "::error::A data source breached its freshness SLA. See 'Fetch Dune data' logs for details."
          exit 1
