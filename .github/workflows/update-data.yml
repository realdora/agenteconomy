name: Update Dune Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    concurrency:
      group: update-data
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch Dune data
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Commit updated data.json
        id: commit-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update Dune data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel production deployment
        if: steps.commit-data.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Missing VERCEL_DEPLOY_HOOK_URL secret. Vercel Git auto-deploy should still deploy this data commit."
            exit 0
          fi
          case "$VERCEL_DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/prj_*)
              ;;
            *)
              echo "::warning::VERCEL_DEPLOY_HOOK_URL is not a Vercel deploy hook URL. Skipping optional deploy hook; Vercel Git auto-deploy should still deploy this data commit."
              exit 0
              ;;
          esac
          curl --connect-timeout 10 --max-time 30 -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
