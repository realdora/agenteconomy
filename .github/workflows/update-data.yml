name: Update Dune Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    concurrency:
      group: update-data
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch Dune data
        id: fetch-data
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          # Recent-window query ids, set as repo VARIABLES (gh variable set …)
          # once the queries are recreated under the working account — see
          # scripts/dune/RUNBOOK-2026-06-29.md. Empty/unset falls back to the
          # code defaults (the dead forks, which fail safe into previous-build).
          DUNE_QID_X402_CUMULATIVE: ${{ vars.DUNE_QID_X402_CUMULATIVE }}
          DUNE_QID_X402_DAILY: ${{ vars.DUNE_QID_X402_DAILY }}
          DUNE_QID_BASE_AGENTIC: ${{ vars.DUNE_QID_BASE_AGENTIC }}
          DUNE_QID_VIRTUALS_ACP: ${{ vars.DUNE_QID_VIRTUALS_ACP }}
          DUNE_QID_REGISTRY: ${{ vars.DUNE_QID_REGISTRY }}
          DUNE_QID_OLAS: ${{ vars.DUNE_QID_OLAS }}
          # Read-only by-chain source (@thechriscen's public query). Deliberately
          # NOT added to DUNE_REFRESH_KEYS below: the pipeline may only download
          # his latest cached execution, never spend credits executing it.
          DUNE_QID_X402_CHAINS: ${{ vars.DUNE_QID_X402_CHAINS }}
          # Only these individually validated recent-window/low-cost sources
          # can spend credits. Keep this explicit so new sources cannot execute
          # until they get their own budget test.
          DUNE_REFRESH_KEYS: 'x402Cumulative,x402Daily,baseAgentic,virtualsAcp,erc8004Registry,olas,x402TokenSplit'
          # Credit governor: free Dune plan has 2,500 credits/month. Keep a
          # 500-credit reserve for manual recovery and unexpected export costs.
          DUNE_MAX_EXECUTIONS_PER_RUN: '7'
          DUNE_MONTHLY_CREDIT_CAP: '2000'
          DUNE_RUN_CREDIT_CAP: '25'
          # 15, not 10: the cap's job is to kill runaway full-history scans
          # (28+ credits), not to strangle a healthy window. Window cost scales
          # with CHAIN ACTIVITY, not just days — at the 2026-07 activity level a
          # 4-day x402 window measures ~5.9 credits (~1.5/window-day, tripled
          # since early July). 15 keeps 2.5x headroom over that while still
          # catching every disaster class we have seen.
          DUNE_QUERY_CREDIT_CAP: '15'
          # Fold daily with a 4-day lag: keeps every window ~5 days, so the
          # priciest query (x402 day-grain, ~0.9 credits/window-day) runs at
          # ~4.5 credits — 2x headroom under the 10-credit query cap. The
          # 7-day defaults let the window peak at 8 days, which hit the cap
          # exactly on 2026-07-10.
          DUNE_FOLD_TRIGGER_DAYS: '4'
          DUNE_FOLD_LAG_DAYS: '4'
        run: node scripts/fetch-data.js

      - name: Commit updated data.json
        id: commit-data
        # baselines.json advances when the pipeline self-folds a window — it must
        # land in the same commit as the data it froze, so both are staged together.
        uses: ./.github/actions/commit-push
        with:
          paths: public/data.json scripts/dune/baselines.json
          message: "chore: update Dune data"

      # Production picks up this commit without a deploy hook: the dashboard is
      # rebuilt by update-dashboard.yml (workflow_run on this workflow's
      # completion) and the apex site proxies data.json at request time. The old
      # deploy-hook step targeted a now-deleted Vercel project and only ever
      # emitted a skip warning, so it was removed.

      # Freshness SLA gate — runs AFTER commit so stale-but-honest data still
      # ships; the red run is the signal that a human needs to look.
      - name: Freshness SLA gate
        if: steps.fetch-data.outputs.sla_breach == 'true'
        run: |
          echo "::error::A data source breached its freshness SLA. See 'Fetch Dune data' logs for details."
          exit 1
