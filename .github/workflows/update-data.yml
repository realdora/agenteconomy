name: Update Dune Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      recovery_20261004:
        description: 'One-time paid-plan catch-up; expires at 2026-10-05 00:00 UTC'
        type: boolean
        default: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    concurrency:
      group: update-data
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch Dune data
        id: fetch-data
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_RECEIPTS_REQUIRED: '1'
          DATA_MONITOR_URL: ${{ vars.DATA_MONITOR_URL }}
          MONITOR_TOKEN: ${{ secrets.DATA_MONITOR_TOKEN }}
          # Owned SQL + versioned registries: scripts/dune/owned/manifest.json.
          # Pin these together with the reviewed definitions and rollback IDs.
          DUNE_QID_X402_CUMULATIVE: '8748138'
          DUNE_QID_X402_DAILY: '8748139'
          DUNE_QID_BASE_AGENTIC: '8748141'
          DUNE_QID_X402TOKENSPLIT: '8748140'
          DUNE_QID_VIRTUALS_ACP: ${{ vars.DUNE_QID_VIRTUALS_ACP }}
          DUNE_QID_REGISTRY: ${{ vars.DUNE_QID_REGISTRY }}
          DUNE_QID_OLAS: ${{ vars.DUNE_QID_OLAS }}
          # Owned chain query, frozen history + bounded daily window.
          DUNE_QID_X402_CHAINS: '8734676'
          # Only these individually validated recent-window/low-cost sources
          # can spend credits. Keep this explicit so new sources cannot execute
          # until they get their own budget test.
          DUNE_REFRESH_KEYS: 'x402Cumulative,x402Daily,baseAgentic,virtualsAcp,erc8004Registry,olas,x402TokenSplit,x402Chains'
          # Paid plan includes 4,000 credits; keep the existing 2,000 local cap.
          DUNE_MAX_EXECUTIONS_PER_RUN: '8'
          DUNE_MONTHLY_CREDIT_CAP: '2000'
          DUNE_RUN_CREDIT_CAP: '45'
          # Default 15; reviewed owned Base query 8748141 gets 20 via shared
          # credit-policy.mjs. Actual remaining daily/monthly budget may lower it.
          DUNE_QUERY_CREDIT_CAP: '15'
          # Incremental sources fold with a four-day lag. Base retains its
          # original full-history semantics and does not use these windows.
          DUNE_FOLD_TRIGGER_DAYS: '4'
          DUNE_FOLD_LAG_DAYS: '4'
        run: |
          if [ "${{ inputs.recovery_20261004 }}" = "true" ]; then
            test "$(date -u +%F)" = '2026-10-04' || { echo 'Recovery allowance expired'; exit 1; }
            export DUNE_RUN_CREDIT_CAP=120 DUNE_QUERY_CREDIT_CAP=45
          fi
          node scripts/fetch-data.js

      - name: Commit updated data.json
        id: commit-data
        # baselines.json advances when the pipeline self-folds a window — it must
        # land in the same commit as the data it froze, so both are staged together.
        uses: ./.github/actions/commit-push
        with:
          paths: public/data.json scripts/dune/baselines.json
          message: "chore: update Dune data"

      # Production picks up this commit without a deploy hook: the dashboard is
      # rebuilt by update-dashboard.yml (workflow_run on this workflow's
      # completion) and the apex site proxies data.json at request time. The old
      # deploy-hook step targeted a now-deleted Vercel project and only ever
      # emitted a skip warning, so it was removed.

      # Freshness SLA gate — runs AFTER commit so stale-but-honest data still
      # ships; the red run is the signal that a human needs to look.
      - name: Freshness SLA gate
        if: steps.fetch-data.outputs.sla_breach == 'true' || steps.fetch-data.outputs.receipt_hold == 'true' || steps.fetch-data.outputs.query_hold == 'true' || steps.fetch-data.outputs.budget_hold == 'true'
        run: |
          echo "::error::Freshness, query hold, budget or shared execution receipt needs attention. Review the fetch logs; do not blindly re-run an ambiguous execution."
          exit 1
