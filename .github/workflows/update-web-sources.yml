name: Update Web Sources

# Non-Dune data (CoinGecko agent-token mcap + x402 Bazaar catalog). Free, no
# secrets required — fully independent of the Dune pipeline, so it keeps the
# dashboard's Market & Supply section fresh even while Dune is blocked.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-web-sources:
    runs-on: ubuntu-latest
    concurrency:
      group: update-web-sources
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch web sources
        env:
          # Optional: a free CoinGecko Demo key makes the call reliable from CI IPs.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # 2026-07-06 sources (free-tier keys; sections skip gracefully when
          # unset, reusing previous values — set via ~/setup-agenteconomy-keys.sh):
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/fetch-web-sources.js

      - name: Commit web-sources.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/web-sources.json
          if git diff --staged --quiet; then
            echo "No web-source changes to commit"
            exit 0
          fi
          git commit -m "chore: update web sources $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Trigger Vercel production deployment
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::No VERCEL_DEPLOY_HOOK_URL; relying on Vercel Git auto-deploy."
            exit 0
          fi
          case "$VERCEL_DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/prj_*)
              curl --connect-timeout 10 --max-time 30 -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" || true ;;
            *) echo "::warning::VERCEL_DEPLOY_HOOK_URL not a deploy hook; skipping." ;;
          esac
