name: Update Tempo Data

# Cloud fallback for the Tempo MPP indexer (replaces the Mac mini, which went
# stale on 2026-04-24). Re-scans the public Tempo RPC (rpc.tempo.xyz, no key)
# for TempoStreamChannel events → public/tempo-data.json, then merges it into
# data.json.tempoMpp (the job the Dune pipeline normally does in Phase 5, but
# that pipeline is frozen until ~6/29 — so we do it here to keep Tempo live).
# Stateless full re-scan, no persistent state, no home server.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-tempo:
    runs-on: ubuntu-latest
    concurrency:
      group: update-tempo
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install deps (viem)
        run: npm ci

      - name: Re-scan Tempo RPC → tempo-data.json
        run: node scripts/index-tempo.mjs public/tempo-data.json

      - name: Merge fresh Tempo into data.json (Dune Phase 5 is frozen until ~6/29)
        run: node scripts/merge-tempo-into-data.mjs

      - name: Commit tempo-data.json + data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tempo-data.json public/data.json
          if git diff --staged --quiet; then
            echo "No Tempo changes to commit"
            exit 0
          fi
          git commit -m "chore: update tempo data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
          # No deploy hook: the dashboard is rebuilt on schedule by
          # update-dashboard.yml and the apex site proxies data.json at request
          # time. The old hook targeted a now-deleted project.
